name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  telemetry-server-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: telemetry-server/package-lock.json

      - name: Install Dependencies
        run: |
          cd telemetry-server
          npm ci

      - name: Run Telemetry Server Tests
        run: |
          cd telemetry-server
          npm test

  mobile-client-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Android Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lint

      - name: Release Build Verification
        run: ./gradlew assembleRelease

      # Potential integration point for secret scanning or dependency review tools
      # Example: 
      # - name: Run Snyk
      #   uses: snyk/actions/gradle@master
      #   with:
      #     token: ${{ secrets.SNYK_TOKEN }}

