name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Rename APKs
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk Igent-debug.apk
          mv app/build/outputs/apk/release/app-release.apk Igent-release.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Igent-debug.apk
            Igent-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
